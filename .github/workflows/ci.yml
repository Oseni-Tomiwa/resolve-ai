name: CI
on: [push, pull_request]
concurrency:
  group: resolveai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Prisma schema validation only requires a syntactically valid value;
      # no database connection is made by this workflow.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/resolveai_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @resolveai/database generate
      - run: pnpm --filter @resolveai/database validate
      - name: Check for merge-conflict markers
        shell: bash
        run: |
          set +e
          git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!pnpm-lock.yaml'
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Merge-conflict markers found."
            exit 1
          elif [ "$status" -eq 1 ]; then
            echo "No merge-conflict markers found."
          else
            exit "$status"
          fi
      - run: pnpm --filter @resolveai/database exec prisma validate --schema ./prisma/schema.prisma
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
